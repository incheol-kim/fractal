<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fractal — Improvisation for Cello and Piano</title>
  <meta name="description" content="A visual piece for a 47-second improvisation for cello and piano by Incheol Kim.">
  <meta property="og:title" content="Fractal — Improvisation for Cello and Piano">
  <meta property="og:description" content="A visual piece for a 47-second improvisation for cello and piano by Incheol Kim.">
  <meta property="og:type" content="website">
  <!-- no icon: an empty one, so the browser does not ask the site for /favicon.ico (a failed request) -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #view { aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); background: #08080c; display: block; }
    #notice { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #000; color: #fff; font-size: 1.3rem; text-align: center; padding: 2rem; z-index: 10; }
    /* The loading notice (src/main.js showStatus) in the end card's face, Geo (src/card.js CARD_FONT,
       assets/fonts/geo/Geo-Regular.ttf), and its ivory (--ink, set by main.js from card.js CARD_INK).
       Declared here so that it is there before anything is loaded, under a name of its own: the end
       card's canvas text keeps the face src/assets.js loads as "Geo". swap: the fallback face shows
       until Geo arrives, so the text is never invisible. Other messages keep the plain face above. */
    @font-face { font-family: "Geo notice"; src: url("/fonts/geo/Geo-Regular.ttf") format("truetype"); font-display: swap; }
    #notice.status { font: clamp(17px, calc(1.1vw + 8px), 26px)/1.7 "Geo notice", ui-monospace, Consolas, monospace;
      letter-spacing: 0.12em; color: rgb(var(--ink)); }
    #notice.status .line { display: block; }
    #notice.status .quiet { font-size: 0.72em; opacity: 0.6; }
    /* The playback controls (src/ui.js): HTML over the canvas, never in its pixels. Echolocation's pause
       screen (Echolocation's src/template.html) in its layout, sizes and opacities, in this
       piece's colours: the end card's ivory (--ink, set by ui.js from card.js CARD_INK) for its cyan,
       a warm dark (--dark) for its blue-black; the centre line in the end card's face (--title-font,
       set by ui.js from CARD_FONT), the hint and the time in Echolocation's monospace. #controls lies
       over the canvas (main.js layout); --u is its height over 1080 px. */
    body.playing { cursor: none; }
    #controls { position: absolute; overflow: hidden; --u: 1; --dark: 8 7 6; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
    #over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
      background: rgb(var(--dark) / 0.55); transition: opacity .6s; }
    #over.hide { opacity: 0; pointer-events: none; }
    #msg { font: 15px/1.6 var(--title-font), ui-monospace, Consolas, monospace; letter-spacing: 0.12em; color: rgb(var(--ink)); text-align: center; }
    /* one set of instructions for every device (a phone may have a keyboard too), and a timeline */
    #ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: max(28px, calc(70px * var(--u))) max(16px, calc(46px * var(--u))) max(8px, calc(26px * var(--u)));
      display: none; background: linear-gradient(to top, rgb(var(--dark) / 0.9), rgb(var(--dark) / 0.65) 55%, rgb(var(--dark) / 0)); }
    #over.ready #ctl { display: block; }
    #hint { text-align: center; font: max(11px, calc(15px * var(--u))) / 1.5 ui-monospace, Consolas, monospace; color: rgb(var(--ink) / 0.8); letter-spacing: 0.06em; }
    #bar { display: flex; align-items: center; gap: 14px; height: max(34px, calc(48px * var(--u))); cursor: pointer; touch-action: none; }
    #track { position: relative; flex: 1; height: 3px; border-radius: 2px; background: rgb(var(--ink) / 0.2); }
    #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: rgb(var(--ink) / 0.75); }
    #knob { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
      background: rgb(var(--ink)); box-shadow: 0 0 8px rgb(var(--ink) / 0.6); }
    #time { min-width: 7.5em; text-align: right; font: max(11px, calc(14px * var(--u))) ui-monospace, Consolas, monospace; color: rgb(var(--ink) / 0.75); letter-spacing: 0.06em; }
    #seekfx { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0; transition: opacity .45s;
      font: 600 max(18px, calc(34px * var(--u))) ui-monospace, Consolas, monospace; letter-spacing: 0.1em; color: rgb(var(--ink));
      padding: 0.35em 0.8em; border-radius: 2em; background: rgb(var(--dark) / 0.6); text-shadow: 0 0 calc(10px * var(--u)) rgb(var(--ink) / 0.5); }
    #seekfx.L { left: 12%; } #seekfx.R { right: 12%; } #seekfx.on { opacity: 0.9; transition: none; }
  </style>
</head>
<body>
  <div id="notice"></div>
  <div id="stage">
    <canvas id="view" width="1920" height="1080"></canvas>
    <div id="controls" lang="en">
      <div id="seekfx"></div>
      <div id="over"><div id="msg"></div>
        <div id="ctl">
          <div id="hint">Tap or Space: play / pause · Double-tap left / right or ← / →: 5 s · , / . : cello note · Drag the bar: jump</div>
          <div id="bar"><div id="track"><div id="fill"></div><div id="knob"></div></div><div id="time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio" src="/fractal.mp3" preload="auto"></audio>
  <script>
    if (location.protocol === 'file:') {
      var n = document.getElementById('notice');
      n.textContent = 'Run npm run dev in a terminal and open http://localhost:5173';
      n.style.display = 'flex';
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
